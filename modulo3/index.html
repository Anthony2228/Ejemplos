<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title">Contáctenos</h2>
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" placeholder="Escriba su nombre">
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" placeholder="nombre@correo.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">Mensaje</label>
                    <textarea class="form-control" rows="4"></textarea>
                </div>
                <button class="btn btn-primary">Enviar mensaje</button>
            </div>
        </div>
    </div>
    

     <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-body">
    <div class="mb-3">
        <label class="form-label">Tema de la consulta</label>
        <select class="form-select">
          <option selected disabled>Seleccione una opción</option>
          <option value="soporte">Soporte técnico</option>
          <option value="ventas">Ventas y presupuestos</option>
          <option value="facturacion">Facturación</option>
          <option value="otros">Otros asuntos</option>
        </select>
      </div>
      

      <div class="mb-3">
        <label class="form-label">Mensaje</label>
        <textarea class="form-control" rows="4"></textarea>
      </div>
      
      <div class="form-check">
<input class="form-check-input" type="checkbox" id="modulo1">
<label class="form-check-label" for="modulo1">Acepto que me contacten</label>
</div>
<br>
    
      <button class="btn btn-success">Enviar mensaje</button>
    </div>
  </div>
</div>

</body>

</html>
