<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!--Panatalla Registro-->
    <div class="container py-5">
<div class="card shadow-sm">
<div class="card-body">
<h2>Registro de estudiantes</h2>
<p class="text-muted">Complete la información solicitada.</p>
<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label">Nombre</label>
<input type="text" class="form-control" placeholder="Nombre completo">
</div>
<div class="col-md-6 mb-3">
<label class="form-label">Teléfono</label>
<input type="tel" class="form-control" placeholder="8888-8888">
</div>
<div class="col-md-6 mb-3">
<label class="form-label">Identificacion</label>
<input type="text" class="form-control" placeholder="Cedula">
</div>
<div class="col-md-6 mb-3">
<label class="form-label">Correo</label>
<input type="email" class="form-control" placeholder="nombre@correo.com">
</div>
<div class="col-md-6 mb-3">
<label class="form-label">Estado</label>
<select class="form-select">
<option>Activo</option>
<option>Inactivo</option>
</select>
</div>
</div>
<button class="btn btn-success">Guardar</button>
<button class="btn btn-secondary">Limpiar</button>
<button class="btn btn-danger">Cancelar</button>
</div>
</div>
</div>
    
</body>
</html>
