<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!--Panatalla Registro-->
    <div class="container py-5">
<div class="card shadow-sm">
<div class="card-body">
<h2>Registro de estudiantes</h2>
<p class="text-muted">Complete la información solicitada.</p>
<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label">Nombre</label>
<input type="text" class="form-control" placeholder="Nombre completo">
</div>
<div class="col-md-6 mb-3">
<label class="form-label">Teléfono</label>
<input type="tel" class="form-control" placeholder="8888-8888">
</div>
<div class="col-md-6 mb-3">
<label class="form-label">Identificacion</label>
<input type="text" class="form-control" placeholder="Cedula">
</div>
<div class="col-md-6 mb-3">
<label class="form-label">Correo</label>
<input type="email" class="form-control" placeholder="nombre@correo.com">
</div>
<div class="col-md-6 mb-3">
<label class="form-label">Estado</label>
<select class="form-select">
<option>Activo</option>
<option>Inactivo</option>
</select>
</div>
</div>
<button class="btn btn-success">Guardar</button>
<button class="btn btn-secondary">Limpiar</button>
<button class="btn btn-danger">Cancelar</button>
</div>
</div>
</div>
    
<!--Pantalla consulta-->
<div class="container py-5">
<div class="card shadow-sm">
<div class="card-body">
<h2>Consulta de contactos</h2>
<div class="row g-2 mb-4">
<div class="col-md-9">
<input type="text" class="form-control"
placeholder="Nombre, teléfono o correo">
</div>
<div class="col-md-3 d-grid">
<button class="btn btn-primary">Buscar</button>
</div>
</div>
<div class="table-responsive">
<table class="table table-striped table-hover align-middle">
<thead class="table-dark">
<tr>
<th>Nombre</th><th>Teléfono</th><th>Correo</th>
<th>Estado</th>
</tr>
</thead>
<tbody>
<tr>
<td>Ana López</td><td>8888-8888</td>
<td>ana@correo.com</td><td>Activo</td>

<tr>
<td>Sofia Aguilar</td><td>5566-8877</td>
<td>sofiaguilar@correo.com</td><td>Activo</td>

<tr><td>Luis Martinez</td><td>1234-5678</td><td>luis@gmail.com</td><td>Inactivo</td>

<td><!-- Aquí irán los botones --></td>
</tr>
</tbody>
</table>
</div>
</div>
</div>
</div>

</body>
</html>
