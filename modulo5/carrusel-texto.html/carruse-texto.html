<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    .carousel-caption {
 background-color: rgba(0, 0, 0, 0.55);
 border-radius: 10px;
 padding: 15px;
}
</style>

</head>
<body>
    

<div id="carruselZoe" class="carousel slide" data-bs-ride="carousel">

  <!-- CONDICIÓN 1: Indicadores para las tres diapositivas -->
  <div class="carousel-indicators"> 
    <button type="button" data-bs-target="#carruselZoe" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button> 
    <button type="button" data-bs-target="#carruselZoe" data-bs-slide-to="1" aria-label="Slide 2"></button> 
    <button type="button" data-bs-target="#carruselZoe" data-bs-slide-to="2" aria-label="Slide 3"></button> 
  </div> 

  <!-- CONTENIDO DE LAS DIAPOSITIVAS -->
  <div class="carousel-inner">

    <!-- Diapositiva 1: Ventas (CONDICIONES 2 y 4) -->
    <div class="carousel-item active"> 
      <img src="img/zoe-ventas.jpg/DIGITALIZAR-VENTAS-300x300.png" class="d-block w-80" alt="Ventas de ZOE"> 
      <div class="carousel-caption d-none d-md-block"> 
        <h5>Facturación y ventas</h5> 
        <p>Registra las operaciones de tu negocio de forma rápida.</p> 
      </div> 
    </div>

    <!-- Diapositiva 2: Inventario (CONDICIONES 2 y 4) -->
    <div class="carousel-item"> 
      <img src="img/zoe-inventario.jpg/inventario-herencia-300x300.png" class="d-block w-80" alt="Inventario de ZOE"> 
      <div class="carousel-caption d-none d-md-block"> 
        <h5>Control de Inventario</h5> 
        <p>Administra tu stock, productos y proveedores en tiempo real.</p> 
      </div> 
    </div>

    <!-- Diapositiva 3: Reportes (CONDICIONES 2 y 4) -->
    <div class="carousel-item"> 
      <img src="img/zoe-reportes.jpg/Iconos-web-05-300x300.png" class="d-block w-80" alt="Reportes de ZOE"> 
      <div class="carousel-caption d-none d-md-block"> 
        <h5>Reportes y Estadísticas</h5> 
        <p>Analiza el crecimiento de tu empresa con gráficos e informes.</p> 
      </div> 
    </div>

  </div>

  <button class="carousel-control-prev" type="button" data-bs-target="#carruselZoe" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Anterior</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carruselZoe" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Siguiente</span>
  </button>

</div>


 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
