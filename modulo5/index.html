<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>OB Soluciones</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    .imagen-destacada {
 width: 100%;
 height: 330px;
 object-fit: cover;
}


.carousel-item img {
 height: 500px;
 object-fit: cover;
}
@media (max-width: 768px) {
 .carousel-item img {
 height: 280px;
 }
}
</style>


</head>
<body>
 <!-- Aquí se construirá la página -->
  <img src="img/zoe-inventario.jpg/Gestion-de-almacenes-e-inventario-cambio.jpg"
 class="img-fluid rounded shadow"
 alt="Pantalla del sistema Punto de Venta ZOE">

 <!-- Imagen con 75 % del ancho, alineada a la derecha -->
<img src="img/zoe-inventario.jpg/90NB0ZS2-M01J40-300x300.webp"
 class="img-fluid rounded shadow d-block ms-auto"
 alt="Pantalla de inventario de ZOE">
 


<!-- Alineada a la izquierda: d-block me-auto -->
<img src="img/zoe-reportes.jpg/grfico-300x300.png"
 class="img-fluid rounded shadow d-block me-auto"
 alt="Pantalla de reportes de ZOE">



<!-- Centrada: d-block mx-auto -->
<img src="img/zoe-ventas.jpg/punto-de-venta-300x300.webp"
 class="img-fluid rounded shadow d-block mx-auto"
 alt="Pantalla de ventas de ZOE">




<div id="carruselZoe" class="carousel slide" data-bs-ride="carousel">
 <div class="carousel-inner">
 <div class="carousel-item active">
 <img src="img/zoe-ventas.jpg/persistencia-en-ventas-300x300.webp" class="d-block w-80" alt="Ventas de ZOE">
 </div>
 <div class="carousel-item">
 <img src="img/zoe-inventario.jpg/inventario-seguridad-300x300.jpg" class="d-block w-80" alt="Inventario de ZOE">
 </div>
 </div>


 <button class="carousel-control-prev" type="button"
 data-bs-target="#carruselZoe" data-bs-slide="prev">
 <span class="carousel-control-prev-icon"></span>
 </button>
 <button class="carousel-control-next" type="button"
 data-bs-target="#carruselZoe" data-bs-slide="next">
 <span class="carousel-control-next-icon"></span>
 </button>
</div>





<div class="carousel-indicators">
 <button type="button" data-bs-target="#carruselZoe"
 data-bs-slide-to="0" class="active"></button>
 <button type="button" data-bs-target="#carruselZoe"
 data-bs-slide-to="1"></button>
 <button type="button" data-bs-target="#carruselZoe"
 data-bs-slide-to="2"></button>
</div>
<div class="carousel-item active">
 <img src="img/zoe-ventas.jpg" class="d-block w-100" alt="Ventas de ZOE">
 <div class="carousel-caption d-none d-md-block">
 <h5>Facturación y ventas</h5>
 <p>Registra las operaciones de tu negocio.</p>
 </div>
</div>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
