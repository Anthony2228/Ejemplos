<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OB Soluciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .carousel-item img {
            height: 500px;
            object-fit: cover;
        }

        .carousel-caption {
            background-color: rgba(0, 0, 0, 0.55);
            border-radius: 10px;
            padding: 15px;
        }

        .seccion-servicio {
            background-color: white;
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .10);
            padding: 35px;
            margin-bottom: 40px;
        }

        .seccion-servicio img {
            width: 100%;
            height: 330px;
            object-fit: cover;
            border-radius: 14px;
        }

        .seccion-servicio h2 {
            color: #0d6efd;
        }

        @media (max-width: 768px) {
            .carousel-item img {
                height: 280px;
            }

            .seccion-servicio {
                padding: 22px;
            }

            .seccion-servicio img {
                height: 230px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#inicio">OB Soluciones</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#inicio">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#empresa">Empresa</a></li>
                    <li class="nav-item"><a class="nav-link" href="#servicios">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contacto">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <header id="inicio">
        <div id="carruselZoe" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carruselZoe" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#carruselZoe" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#carruselZoe" data-bs-slide-to="2"></button>
            </div>
            <div class="carousel-inner shadow">
                <div class="carousel-item active">
                    <img src="img/zoe-ventas.jpg/FACTURA-ELECTRONICA-COSTA-RICA-1024x512.jpg" class="d-block w-100" alt="Ventas de ZOE">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>Facturación y ventas</h5>
                        <p>Registra las operaciones de tu negocio.</p>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="img/zoe-inventario.jpg/hs_control-inventarios-1.webp" class="d-block w-100" alt="Inventario de ZOE">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>Control de inventario</h5>
                        <p>Consulta existencias y movimientos.</p>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="img/zoe-reportes.jpg/img8.jpg" class="d-block w-100" alt="Reportes de ZOE">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>Reportes y análisis</h5>
                        <p>Consulta información importante para tu negocio.</p>
                    </div>
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carruselZoe" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carruselZoe" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </header>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
