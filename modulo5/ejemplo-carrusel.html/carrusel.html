<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OB Soluciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    .carousel-item img {
 height: 500px;
 object-fit: cover;
}
@media (max-width: 768px) {
 .carousel-item img {
 height: 280px;
 }
}
</style>

</head>
<body>
    
<div id="carruselZoe" class="carousel slide" data-bs-ride="carousel">
 <div class="carousel-inner">
 <div class="carousel-item active">
 <img src="img/zoe-ventas.jpg/persistencia-en-ventas-300x300.webp" class="d-block w-80" alt="Ventas de ZOE">
 </div>
 <div class="carousel-item">
 <img src="img/zoe-inventario.jpg/inventario-seguridad-300x300.jpg" class="d-block w-80" alt="Inventario de ZOE">
 </div>
 </div>
 <div class="carousel-item"> 
      <img src="img/zoe-reportes.jpg/logos-sitio-cobranzas-grandi-63-300x300.png" class="d-block w-80" alt="Reportes de ZOE"> 
    </div>


 <button class="carousel-control-prev" type="button"
 data-bs-target="#carruselZoe" data-bs-slide="prev">
 <span class="carousel-control-prev-icon"></span>
 </button>
 <button class="carousel-control-next" type="button"
 data-bs-target="#carruselZoe" data-bs-slide="next">
 <span class="carousel-control-next-icon"></span>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
